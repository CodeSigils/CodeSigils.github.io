name: Live site smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public site endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 --silent --show-error https://codesigils.github.io/ --output homepage.html
          rg -q 'data-md-component="search"' homepage.html
          rg -q '<title>Code Sigils' homepage.html

          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 --silent --show-error https://codesigils.github.io/feed.xml --output feed.xml
          rg -q '<rss' feed.xml

          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 --silent --show-error https://codesigils.github.io/sitemap.xml --output sitemap.xml
          rg -q '<urlset' sitemap.xml

          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 --silent --show-error https://codesigils.github.io/search.json --output search.json
          test -s search.json
